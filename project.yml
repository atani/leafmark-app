name: EPUBReaderSpike
options:
  bundleIdPrefix: com.atani
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    from: "3.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  EPUBReaderSpike:
    type: application
    platform: iOS
    sources:
      - path: Sources
        name: Sources
    dependencies:
      - package: Readium
        products:
          - ReadiumShared
          - ReadiumStreamer
          - ReadiumNavigator
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: EPUB Reader
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Publication
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atani.EPUBReaderSpike
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
