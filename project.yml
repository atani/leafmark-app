name: Leafmark
options:
  bundleIdPrefix: com.atani
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.92.0
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    # 3.10.0 + フォント CORS 修正 (#845) を含む develop 固定。3.11 タグが出たら
    # from 指定に戻す (https://github.com/atani/epub-reader-ios/issues/18)。
    revision: 8811f0ec6fff3562ffc4b739d22733cf259431d9
  Firebase:
    # Peyo で運用実績のある版 (2026-07-28 公開)。ADR-0009。
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.17.0

settings:
  base:
    # RevenueCat observer。設定と公開 SDK キーの扱いは docs/revenuecat-migration.md。
    REVENUECAT_MODE: observer
    REVENUECAT_PUBLIC_SDK_KEY: appl_WgQUDiEFTHgxCpPyYycrMwpzxAo
    REVENUECAT_DATA_SHARING_APPROVED: "YES"
    REVENUECAT_INTEGRATION_READY: "YES"
    REVENUECAT_PRIVACY_READY: "YES"
    REVENUECAT_RELEASE_ENABLED: "YES"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "3PC87Z3WVT"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Leafmark:
    type: application
    platform: iOS
    sources:
      - path: Sources
        name: Sources
      - path: Resources
        buildPhase: resources
        # GoogleService-Info.plist の扱いは ADR-0009。Release だけ下のスクリプトで同梱する。
        excludes:
          - GoogleService-Info.plist
    postBuildScripts:
      - name: Copy GoogleService-Info.plist for Release
        basedOnDependencyAnalysis: false
        script: |
          src="${SRCROOT}/Resources/GoogleService-Info.plist"
          dst="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          rm -f "$dst"
          if [ "${CONFIGURATION}" != "Release" ]; then exit 0; fi
          if [ -f "$src" ]; then
            cp "$src" "$dst"
          else
            echo "warning: Resources/GoogleService-Info.plist がありません。このビルドは Firebase Analytics に何も送りません（README の手順で取得してください）。"
          fi
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      # IDFA 対応を含まない product。理由は ADR-0009。
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Readium
        products:
          - ReadiumShared
          - ReadiumStreamer
          - ReadiumNavigator
    info:
      path: Info.plist
      properties:
        RevenueCatMode: "$(REVENUECAT_MODE)"
        RevenueCatPublicSDKKey: "$(REVENUECAT_PUBLIC_SDK_KEY)"
        RevenueCatDataSharingApproved: "$(REVENUECAT_DATA_SHARING_APPROVED)"
        RevenueCatIntegrationReady: "$(REVENUECAT_INTEGRATION_READY)"
        RevenueCatPrivacyReady: "$(REVENUECAT_PRIVACY_READY)"
        RevenueCatReleaseEnabled: "$(REVENUECAT_RELEASE_ENABLED)"
        # Firebase Analytics の安全設定。理由は ADR-0009。
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_USER_DATA: false
        GOOGLE_ANALYTICS_REGISTRATION_WITH_AD_NETWORK_ENABLED: false
        FirebaseAutomaticScreenReportingEnabled: false
        FirebaseAppDelegateProxyEnabled: false
        CFBundleDisplayName: Leafmark
        # Keep versions pointed at build settings — without these keys
        # xcodegen regenerates Info.plist with hardcoded 1.0/1, which
        # breaks App Store uploads ("CFBundleShortVersionString must be
        # higher") whenever the project is regenerated.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No non-exempt encryption (HTTPS + Apple-standard crypto only).
        # Pre-answers the export-compliance question on every build upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad supports all four orientations (multitasking-friendly, clears
        # the "all interface orientations must be supported" build warning).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Publication
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atani.inkwell
        # iCloud Documents entitlement for annotation sync (ADR-0007). The
        # bundle id stays com.atani.inkwell; only the iCloud container is
        # namespaced as iCloud.com.atani.inkwell.
        CODE_SIGN_ENTITLEMENTS: Leafmark.entitlements
        MARKETING_VERSION: "1.20"
        CURRENT_PROJECT_VERSION: "29"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconPaperLeaf

  LeafmarkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Leafmark.storekit
        buildPhase: resources
    dependencies:
      - target: Leafmark
      - package: Readium
        products:
          - ReadiumShared
          - ReadiumNavigator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atani.inkwellTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Leafmark:
    build:
      targets:
        Leafmark: all
    test:
      targets:
        - LeafmarkTests
    run:
      config: Debug
      storeKitConfiguration: Leafmark.storekit
