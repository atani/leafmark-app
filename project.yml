name: Leafmark
options:
  bundleIdPrefix: com.atani
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    # 3.10.0 + フォント CORS 修正 (#845) を含む develop 固定。3.11 タグが出たら
    # from 指定に戻す (https://github.com/atani/epub-reader-ios/issues/18)。
    revision: 8811f0ec6fff3562ffc4b739d22733cf259431d9

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "3PC87Z3WVT"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Leafmark:
    type: application
    platform: iOS
    sources:
      - path: Sources
        name: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Readium
        products:
          - ReadiumShared
          - ReadiumStreamer
          - ReadiumNavigator
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Leafmark
        # Keep versions pointed at build settings — without these keys
        # xcodegen regenerates Info.plist with hardcoded 1.0/1, which
        # breaks App Store uploads ("CFBundleShortVersionString must be
        # higher") whenever the project is regenerated.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No non-exempt encryption (HTTPS + Apple-standard crypto only).
        # Pre-answers the export-compliance question on every build upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad supports all four orientations (multitasking-friendly, clears
        # the "all interface orientations must be supported" build warning).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Publication
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atani.inkwell
        MARKETING_VERSION: "1.5.1"
        CURRENT_PROJECT_VERSION: "10"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  LeafmarkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Leafmark.storekit
        buildPhase: resources
    dependencies:
      - target: Leafmark
      - package: Readium
        products:
          - ReadiumShared
          - ReadiumNavigator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atani.inkwellTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Leafmark:
    build:
      targets:
        Leafmark: all
    test:
      targets:
        - LeafmarkTests
    run:
      config: Debug
      storeKitConfiguration: Leafmark.storekit
